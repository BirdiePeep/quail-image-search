# Builds the release packages with scripts/build.ps1 and publishes them as a GitHub release.
# Run it from the Actions tab ("Release" > "Run workflow"). The version is the latest vX.Y.Z tag
# bumped by the chosen part; with no tags yet, it's <Version> from the project file.
# See docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pick the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          $project = [version](([xml](Get-Content src/QuailImageSearch/QuailImageSearch.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          $latest = git tag --list 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_.Substring(1) } | Sort-Object | Select-Object -Last 1
          if (-not $latest) {
            $next = $project
          } else {
            $next = switch ($env:BUMP) {
              'major' { [version]::new($latest.Major + 1, 0, 0) }
              'minor' { [version]::new($latest.Major, $latest.Minor + 1, 0) }
              default { [version]::new($latest.Major, $latest.Minor, $latest.Build + 1) }
            }
            # Raising <Version> in the project file past the latest tag sets the next version directly.
            if ($project -gt $next) { $next = $project }
          }
          $v = '{0}.{1}.{2}' -f $next.Major, $next.Minor, [math]::Max($next.Build, 0)
          Write-Host "Latest tag: $(if ($latest) { "v$latest" } else { 'none' }); releasing $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        run: ./scripts/build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Check the packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $expected = 'win-x64-setup.exe', 'win-x64.zip', 'win-arm64-setup.exe', 'win-arm64.zip', 'macos-arm64.zip', 'linux-x64.tar.gz' |
            ForEach-Object { "artifacts/QuailImageSearch-$env:VERSION-$_" }
          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing packages: $($missing -join ', ')" }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = @(Get-ChildItem "artifacts/QuailImageSearch-$env:VERSION-*" | ForEach-Object FullName) + 'artifacts/SHA256SUMS.txt'
          gh release create "v$env:VERSION" @files --target $env:GITHUB_SHA --title "Quail Image Search $env:VERSION" --generate-notes
          if ($LASTEXITCODE) { throw 'Creating the release failed.' }
